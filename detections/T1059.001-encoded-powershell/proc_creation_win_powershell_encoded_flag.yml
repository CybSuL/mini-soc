title: PowerShell Encoded Command
id: 9938e711-635f-418c-944a-0abaa650d502
status: experimental
description: Detects powershell.exe or pwsh.exe started with an encoded command flag (-e, -enc, -EncodedCommand), regardless of what the Base64 contains.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Sul
date: 2026-11-23
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_flag:
        CommandLine|contains|windash:
            - ' -e '
            - ' -en '
            - ' -ec '
            - ' -enc'
    condition: selection_img and selection_flag
falsepositives:
    - using management tools and installers
level: medium